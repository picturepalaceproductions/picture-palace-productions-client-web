<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Picture Palace Productions - Wedding Album Photo Selection">

  <!-- PWA / iOS -->
  <meta name="theme-color" content="#0B0B0B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Album Selection">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Picture Palace Album Selection</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>

  <script>
    // Picture Palace Album Selection PWA install bridge.
    (function () {
      let deferredInstallPrompt = null;

      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        deferredInstallPrompt = event;
      });

      window.picturePalaceIsStandalone = function () {
        return window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
      };

      window.picturePalaceInstall = async function () {
        if (!deferredInstallPrompt) {
          return false;
        }

        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;

        return choice && choice.outcome === "accepted";
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
